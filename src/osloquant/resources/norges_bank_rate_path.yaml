# Norges Bank's policy rate path: the projected policy rate (quarterly average, per cent) published with each Monetary
# Policy Report (Pengepolitisk rapport, PPR). Copied from the report's own chart-data workbook ("data" below; the sheet
# with the columns "Policy rate (level)" and "Policy rate MPR x/yy", column "Policy rate"), from the report's quarter
# onward. The bank publishes no stable machine-readable path: the workbook's name and layout change from report to
# report, so the file is filled in by hand after each report (DECISIONS D73). The dashboard warns when a
# report date in norges_bank_meetings.yaml has passed that is newer than the newest report here.
# The first quarter of a path is partly history (the report is published inside it); the bank's own number is kept.
# Norges Bank allows reproduction with the bank as the source. Workbooks as they stood on the day in "copied".
